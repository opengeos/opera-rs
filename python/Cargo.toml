[package]
name = "opera-py"
description = "Python bindings for opera-rs (NASA OPERA search, visualization, analysis, and MCP server)"
publish = false
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/opengeos/opera-rs"

[lib]
name = "_opera_rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
opera-rs = { path = "../crates/opera-rs" }
opera-cli = { path = "../crates/opera-cli" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
serde = "1"
serde_json = "1"
