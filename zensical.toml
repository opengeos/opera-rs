[project]
site_name = "opera-rs"
site_description = "Pure-Rust, agent-centric toolkit for searching, visualizing, and analyzing NASA OPERA satellite data"
site_author = "opengeos"
site_url = "https://opera-rs.opengeos.org"
repo_url = "https://github.com/opengeos/opera-rs"
repo_name = "opengeos/opera-rs"
extra_css = ["stylesheets/playground.css"]
extra_javascript = ["javascripts/playground.js"]
copyright = "opera-rs is released under the MIT License. See <a href=\"https://github.com/opengeos/opera-rs/blob/main/NOTICE\">NOTICE</a>."

nav = [
  { "Home" = "index.md" },
  { "Playground" = "playground.md" },
  { "Installation" = "installation.md" },
  { "Notebooks" = "notebooks.md" },
  { "CLI Reference" = "cli.md" },
  { "AI Agents (MCP)" = "mcp.md" },
  { "Rust Library" = "rust.md" },
  { "Python API" = "python.md" },
  { "Benchmarks" = "benchmarks.md" },
  { "Report Issues" = "https://github.com/opengeos/opera-rs/issues" },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
