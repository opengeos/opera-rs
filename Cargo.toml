[workspace]
resolver = "3"
members = ["crates/opera-rs", "crates/opera-cli"]
exclude = ["python", "js"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/opengeos/opera-rs"
authors = ["Qiusheng Wu <giswqs@gmail.com>"]

[workspace.dependencies]
opera-rs = { path = "crates/opera-rs", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gif = "0.14"
png = "0.17"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terrio = { version = "0.9", default-features = false, features = ["geotiff", "sqlite"] }
thiserror = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
